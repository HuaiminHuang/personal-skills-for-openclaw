interface:
  display_name: "Video Tutor"
  short_description: "Turn a video lecture into structured Chinese teaching notes (Markdown or LaTeX/PDF)."
  default_prompt: "Use this skill to turn a video URL into high-quality structured teaching notes with clear pedagogical flow, extracted key frames inspected visually, exhaustive frame recall before selection, segment splitting with parallel subagents for longer videos, the original video cover on the front page, and a final synthesis section. Falls back to Whisper transcription when CC subtitles are unavailable."
